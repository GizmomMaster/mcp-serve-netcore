# Развёртывание центрального MCP-сервера (scope п.8, NFR-21).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-wiki-mcp
  labels:
    app: central-wiki-mcp
spec:
  # NFR-21: сервис stateless, поэтому масштабируется репликами.
  replicas: 2
  selector:
    matchLabels:
      app: central-wiki-mcp
  template:
    metadata:
      labels:
        app: central-wiki-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
      containers:
        - name: server
          image: artifactory.akbars.tech/central-wiki-mcp:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # NFR-35: секреты только из Secret, не из образа и не из appsettings.
            - name: WIKIMCP_Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: central-wiki-mcp-secrets
                  key: database-connection-string
            - name: WIKIMCP_RateLimiting__RedisConnectionString
              valueFrom:
                secretKeyRef:
                  name: central-wiki-mcp-secrets
                  key: redis-connection-string
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          # FR-07: liveness не трогает зависимости, иначе падение БД
          # вызвало бы перезапуск здоровых подов.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # FR-08: readiness учитывает БД и состояние синхронизации.
          readinessProbe:
            httpGet:
              path: /health/full
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: wiki-content
              mountPath: /app/wiki-content
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: wiki-content
          persistentVolumeClaim:
            claimName: wiki-content
        - name: tmp
          emptyDir: {}
      # NFR-23: время на корректное завершение запросов.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: central-wiki-mcp
spec:
  selector:
    app: central-wiki-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
